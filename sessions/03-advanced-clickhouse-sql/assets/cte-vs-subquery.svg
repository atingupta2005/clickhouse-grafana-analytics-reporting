<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<text x="460" y="28" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">CTE vs subquery (same idea)</text>
<rect x="40" y="50" width="400" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="40" y="50" width="400" height="38" rx="12" fill="#2563eb"/>
<rect x="40" y="72" width="400" height="16" fill="#2563eb"/>
<text x="240" y="76" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">WITH cte AS (...)</text>
<text x="60" y="112" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Named step</text>
<text x="60" y="134" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Easier to read</text>
<text x="60" y="156" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Chain multiple steps</text>
<rect x="480" y="50" width="400" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="480" y="50" width="400" height="38" rx="12" fill="#7c3aed"/>
<rect x="480" y="72" width="400" height="16" fill="#7c3aed"/>
<text x="680" y="76" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Nested subquery</text>
<text x="500" y="112" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Inline SELECT</text>
<text x="500" y="134" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Can get deep fast</text>
<text x="500" y="156" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Harder to debug</text>
<text x="460" y="242" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Prefer CTEs when teaching multi-step analytics</text>
</svg>
