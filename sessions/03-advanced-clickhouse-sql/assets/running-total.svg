<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<text x="460" y="28" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Running total over ordered dates</text>
<rect x="60" y="60" width="170" height="70" rx="10" fill="#2563eb"/>
<text x="145.0" y="89.0" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Day 1</text>
<text x="145.0" y="105.0" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">+100</text>
<text x="145" y="160" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">running = 100</text>
<path d="M234 95 H256" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="260" y="60" width="170" height="70" rx="10" fill="#2563eb"/>
<text x="345.0" y="89.0" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Day 2</text>
<text x="345.0" y="105.0" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">+80</text>
<text x="345" y="160" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">running = 180</text>
<path d="M434 95 H456" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="460" y="60" width="170" height="70" rx="10" fill="#2563eb"/>
<text x="545.0" y="89.0" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Day 3</text>
<text x="545.0" y="105.0" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">+50</text>
<text x="545" y="160" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">running = 230</text>
<path d="M634 95 H656" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="660" y="60" width="170" height="70" rx="10" fill="#2563eb"/>
<text x="745.0" y="89.0" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Day 4</text>
<text x="745.0" y="105.0" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">+70</text>
<text x="745" y="160" text-anchor="middle" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">running = 300</text>
<text x="460" y="200" text-anchor="middle" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">sum(amount) OVER (ORDER BY day) grows as you move forward</text>
<text x="460" y="240" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Use ORDER BY inside OVER for cumulative metrics</text>
</svg>
