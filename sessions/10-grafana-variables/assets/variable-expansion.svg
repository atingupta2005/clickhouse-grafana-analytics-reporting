<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#f8fafc"/>
<text x="460" y="28" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Variable expansion (ClickHouse)</text>
<rect x="40" y="50" width="400" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="40" y="50" width="400" height="38" rx="12" fill="#2563eb"/>
<rect x="40" y="72" width="400" height="16" fill="#2563eb"/>
<text x="240" y="76" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">In the panel (template)</text>
<text x="60" y="112" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">WHERE region_id IN (${region})</text>
<text x="60" y="134" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">  AND status IN (${status:sqlstring})</text>
<rect x="480" y="50" width="400" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="480" y="50" width="400" height="38" rx="12" fill="#059669"/>
<rect x="480" y="72" width="400" height="16" fill="#059669"/>
<text x="680" y="76" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">After Grafana expands</text>
<text x="500" y="112" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">WHERE region_id IN (1,3)</text>
<text x="500" y="134" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">  AND status IN ('Completed')</text>
<text x="460" y="232" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Multi-value must use IN (...) - not a single = comparison</text>
</svg>
