<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">PARTITION BY versus ORDER BY</title>
  <desc id="desc">Partitions split data by month. ORDER BY sorts rows inside parts for skipping.</desc>
  <rect width="920" height="260" rx="12" fill="#f8fafc"/>
  <text x="460" y="34" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Two different design knobs</text>

  <rect x="40" y="56" width="400" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="40" y="56" width="400" height="42" rx="12" fill="#ea580c"/>
  <rect x="40" y="82" width="400" height="16" fill="#ea580c"/>
  <text x="240" y="84" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PARTITION BY</text>
  <rect x="70" y="120" width="100" height="56" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <rect x="190" y="120" width="100" height="56" rx="8" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="310" y="120" width="100" height="56" rx="8" fill="#fdba74" stroke="#ea580c"/>
  <text x="120" y="153" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">202301</text>
  <text x="240" y="153" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">202302</text>
  <text x="360" y="153" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">202303</text>
  <text x="240" y="200" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Splits data into folders / chunks</text>

  <rect x="480" y="56" width="400" height="160" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="480" y="56" width="400" height="42" rx="12" fill="#059669"/>
  <rect x="480" y="82" width="400" height="16" fill="#059669"/>
  <text x="680" y="84" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">ORDER BY (sorting key)</text>
  <text x="510" y="130" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="13">Inside a part, rows are sorted by key</text>
  <text x="510" y="156" fill="#065f46" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">region -&gt; date -&gt; order_id</text>
  <text x="510" y="182" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Helps sparse index and data skipping</text>
  <text x="510" y="204" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Not a SQL Server-style unique PK</text>

  <text x="460" y="242" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Use both deliberately - partitioning is not sorting</text>
</svg>
