<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">ClickHouse query path</title>
  <desc id="desc">Client sends a query to the server. Query processing reads storage parts and returns a result.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="sh" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="920" height="220" rx="12" fill="#f8fafc"/>
  <text x="460" y="34" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">How a query moves through ClickHouse</text>

  <g filter="url(#sh)">
    <rect x="36" y="70" width="120" height="90" rx="12" fill="#2563eb"/>
    <text x="96" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">BI / App</text>
    <text x="96" y="134" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="12">SELECT</text>
  </g>
  <path d="M164 115 H200" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="212" y="70" width="150" height="90" rx="12" fill="#7c3aed"/>
    <text x="287" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CH server</text>
    <text x="287" y="134" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="12">entry point</text>
  </g>
  <path d="M370 115 H406" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="418" y="70" width="150" height="90" rx="12" fill="#ea580c"/>
    <text x="493" y="105" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Query</text>
    <text x="493" y="125" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">processing</text>
    <text x="493" y="147" text-anchor="middle" fill="#ffedd5" font-family="Segoe UI, Arial, sans-serif" font-size="12">filter  /  aggregate</text>
  </g>
  <path d="M576 115 H612" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="624" y="70" width="130" height="90" rx="12" fill="#059669"/>
    <text x="689" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Storage</text>
    <text x="689" y="134" text-anchor="middle" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="12">data parts</text>
  </g>
  <path d="M762 115 H798" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="810" y="70" width="74" height="90" rx="12" fill="#0f766e"/>
    <text x="847" y="112" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Result</text>
    <text x="847" y="134" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="11">rows</text>
  </g>

  <text x="460" y="198" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Columnar storage means only needed columns are read from parts</text>
</svg>
